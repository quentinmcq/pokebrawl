<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Des centaines de Pokémon s'affrontent en même temps : choisis deux camps et regarde."
    />
    <meta name="theme-color" content="#12131f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PokéBrawl" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>PokéBrawl</title>
  </head>
  <body>
    <main id="stage" class="stage">
      <p class="loading">Chargement de l'arène…</p>

      <form id="menu" class="menu" hidden>
        <h1 class="logo">Poké<span>Brawl</span></h1>
        <p class="tagline">Choisis deux camps et regarde-les s'affronter.</p>
        <label class="field field--blue">
          <span>Camp bleu</span>
          <select name="a"></select>
        </label>
        <label class="field field--red">
          <span>Camp rouge</span>
          <select name="b"></select>
        </label>
        <label class="field">
          <span>Terrain</span>
          <select name="terrain"></select>
        </label>
        <label class="field">
          <span>Graine</span>
          <input name="seed" inputmode="numeric" pattern="[0-9]*" placeholder="Au hasard" autocomplete="off" />
        </label>
        <label class="toggle">
          <input type="checkbox" name="same" />
          <span>Même nombre de Pokémon par camp</span>
        </label>
        <button class="primary" type="submit">Lancer le combat</button>
        <button class="secondary" type="button" id="install" hidden>Installer l'application</button>
        <p class="hint" id="ios-install" hidden>Pour l'installer : Partager, puis « Sur l'écran d'accueil ».</p>
      </form>

      <nav id="controls" class="controls" aria-label="Contrôles du combat" hidden>
        <button type="button" data-action="toggle" aria-label="Pause"></button>
        <div class="speeds" role="group" aria-label="Vitesse">
          <button type="button" data-speed="1">×1</button>
          <button type="button" data-speed="2">×2</button>
          <button type="button" data-speed="4">×4</button>
        </div>
        <button type="button" data-action="new" aria-label="Nouveau combat"></button>
        <button type="button" data-action="record" class="record" aria-label="Enregistrer la vidéo"></button>
        <button type="button" data-action="menu" aria-label="Paramètres"></button>
        <button type="button" data-action="fullscreen" aria-label="Plein écran"></button>
      </nav>

      <div id="recording" class="recording" role="status" hidden>
        <span class="recording-dot" aria-hidden="true"></span>
        <span>Enregistrement…</span>
        <button type="button">Arrêter</button>
      </div>

      <div id="video-ready" class="video-ready" role="dialog" aria-label="Vidéo prête" hidden>
        <p>Ta vidéo est prête&nbsp;!</p>
        <button class="primary" type="button" data-action="share">Partager</button>
        <a class="secondary" data-action="download">Télécharger</a>
        <button class="secondary" type="button" data-action="close">Fermer</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
