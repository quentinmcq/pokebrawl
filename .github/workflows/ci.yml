name: CI

# Checks every push to main and every pull request (Renovate's included, which merge on their own once green).
# Deploying stays a manual `bun run deploy`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, formatage, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  e2e:
    name: Tests fonctionnels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Sprites et cris des Pokémon (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/sprites
            public/cries
          key: sprites-${{ hashFiles('scripts/fetch-sprites.ts', 'scripts/fetch-cries.ts', 'src/data/pokemon.json') }}
          # The scripts skip the files already there: an older cache leaves only the new ones to fetch.
          restore-keys: sprites-
      - run: bun run sprites
      - run: bunx playwright install --with-deps --only-shell chromium
      - run: bun run build
      - run: bunx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
