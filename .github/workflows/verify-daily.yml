name: Contrôle du classement

# Every night, replays the previous day's daily scores and removes the teams that do not actually win: the free
# Worker cannot replay battles when scores arrive. Needs the CLOUDFLARE_API_TOKEN secret (D1 edit permission).
on:
  schedule:
    # 00:30 UTC, after midnight in France in summer and winter alike: the day before is complete.
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rejouer les scores de la veille
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run verify-daily --day yesterday --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
